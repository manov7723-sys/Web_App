version: 0.0
os: linux

files:
  - source: backend/           
    destination: /home/ubuntu/app
  - source: scripts/
    destination: /home/ubuntu/scripts

permissions:
  - object: /home/ubuntu/scripts/
    pattern: "*.sh"
    mode: 755
    owner: ubuntu
    group: ubuntu
    type:
      - file

hooks:
  BeforeInstall:
    - location: scripts/stop_server.sh
      timeout: 120
      runas: root
  AfterInstall:
    - location: scripts/install_dependencies.sh
      timeout: 600
      runas: root
  ApplicationStart:
    - location: scripts/start_server.sh
      timeout: 300
      runas: ubuntu
