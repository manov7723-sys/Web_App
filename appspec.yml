version: 0.0
os: linux

files:
  - source: frontend
    destination: /home/ubuntu/app/frontend
  - source: backend
    destination: /home/ubuntu/app/backend
  - source: scripts
    destination: /home/ubuntu/scripts

file_exists_behavior: OVERWRITE

permissions:
  - object: /home/ubuntu/scripts
    pattern: "*.sh"
    mode: 755
    owner: ubuntu
    group: ubuntu
    type: [file]
  - object: /home/ubuntu/app/backend
    pattern: "**"
    mode: 755
    owner: ubuntu
    group: ubuntu
    type: [file]
  - object: /home/ubuntu/app/frontend
    pattern: "**"
    mode: 644
    owner: ubuntu
    group: ubuntu
    type: [file]

hooks:
  BeforeInstall:
    - location: scripts/stop_server.sh      # ← YOUR script!
      timeout: 120
      runas: root

  AfterInstall:
    - location: scripts/02_install_nginx_deps.sh  # ← NEW
      timeout: 600
      runas: root

  ApplicationStart:
    - location: scripts/03_start_servers.sh       # ← NEW
      timeout: 300
      runas: ubuntu
