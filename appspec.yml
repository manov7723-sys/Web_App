version: 0.0
os: linux

files:
  - source: frontend
    destination: /home/ubuntu/app/frontend
  - source: backend
    destination: /home/ubuntu/app/backend
  - source: scripts
    destination: /home/ubuntu/scripts

file_exists_behavior: OVERWRITE

permissions:
  - object: /home/ubuntu/scripts
    pattern: "*.sh"
    mode: 755
    owner: ubuntu
    group: ubuntu
    type: [file]
  - object: /home/ubuntu/app/backend
    pattern: "**"
    mode: 755
    owner: ubuntu
    group: ubuntu
    type: [file]
  - object: /home/ubuntu/app/frontend
    pattern: "**"
    mode: 644
    owner: ubuntu
    group: ubuntu
    type: [file]

hooks:
  BeforeInstall:
    - location: scripts/01_install_agent.sh    # ← NEW: Installs CodeDeploy agent
      timeout: 600
      runas: root
  AfterInstall:
    - location: scripts/stop_server.sh         # ← YOUR existing
      timeout: 120
      runas: root
  ApplicationStart:
    - location: scripts/install_dependencies.sh # ← YOUR updated
      timeout: 600
      runas: root
    - location: scripts/start_server.sh        # ← PM2 start
      timeout: 300
      runas: ubuntu
