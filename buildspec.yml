version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 18
    commands:
      - echo "Installing Angular CLI"
      - npm install -g @angular/cli

  pre_build:
    commands:
      - echo "Installing frontend dependencies"
      - cd frontend
      - npm install
      - cd ..

  build:
    commands:
      - echo "Building Angular frontend"
      - cd frontend
      - ng build --configuration production
      - cd ..

  post_build:
    commands:
      - echo "Creating CodeDeploy bundle"
      - zip -r codedeploy.zip appspec.yml backend frontend/dist scripts
      - echo "Verify zip"
      - unzip -l codedeploy.zip

artifacts:
  files:
    - codedeploy.zip