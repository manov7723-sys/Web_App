version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 18
    commands:
      - echo "Installing Angular CLI"
      - npm install -g @angular/cli

  pre_build:
    commands:
      - echo "Installing frontend dependencies"
      - cd frontend && npm install && cd ..

  build:
    commands:
      - echo "Building Angular frontend"
      - cd frontend && ng build --configuration production && cd ..

  post_build:  # ← ADD THIS SECTION!
    commands:
      - echo "🎯 Creating CodeDeploy bundle..."
      - mkdir deployment
      - cp appspec.yml deployment/
      - cp -r frontend/dist deployment/frontend/  
      - cp -r backend deployment/
      - cp -r scripts deployment/              # ← ROOT LEVEL!
      - chmod 755 deployment/scripts/*.sh
      - cd deployment && zip -r ../codedeploy.zip .
      - aws s3 cp codedeploy.zip s3://codepipeline-us-east-1-d26d85020b51-41c2-83b1-5094ad033d74/codedeploy.zip

artifacts:
  files:
    - codedeploy.zip  # ← ONLY THIS FILE!
