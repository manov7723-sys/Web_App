version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 18
    commands:
      - echo "Installing Angular CLI..."
      - npm install -g @angular/cli
      
  pre_build:
    commands:
      - echo "Installing Angular dependencies..."
      - cd frontend
      - npm ci
      
  build:
    commands:
      - echo "Building Angular frontend..."
      - npx ng build --configuration production --output-path=dist/angular-app
      - cd ..
      - echo "Installing Node server dependencies..."
      - cd server
      - npm ci
      
  post_build:
    commands:
      - echo "Packaging deployment artifact..."
      - cd ..
      - zip -r app.zip frontend/dist/angular-app/ server/ appspec.yml scripts/
      - echo "Build complete"

artifacts:
  files:
    - app.zip
  discard-paths: yes