version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 18
    commands:
      - echo "Installing Angular CLI"
      - npm install -g @angular/cli

  pre_build:
    commands:
      - echo "Installing frontend dependencies"
      - cd frontend && npm install && cd ..

  build:
    commands:
      - echo "Building Angular frontend"
      - cd frontend && ng build --configuration production && cd ..

  post_build:
    commands:
      - mkdir deployment
      - cp appspec.yml deployment/
      - cp -r frontend/dist deployment/frontend/
      - cp -r backend deployment/
      - cp -r scripts deployment/
      - chmod 755 deployment/scripts/*.sh
      - cd deployment && zip -r ../codedeploy.zip .

artifacts:
  files:
    - codedeploy.zip  # ← ONLY THIS FILE!
