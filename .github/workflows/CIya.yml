name: Build and Push to Artifact Registry

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      REGION: us-west1
      FRONTEND_REPO: frontend-repo
      BACKEND_REPO: backend-repo
      FRONTEND_IMAGE: myapp1_frontend
      BACKEND_IMAGE: myapp1_backend

    permissions:
      contents: read
      id-token: write

    steps:

      # =========================
      # Checkout Code
      # =========================
      - name: Checkout Code
        uses: actions/checkout@v4

      # =========================
      # Set Image Tag
      # =========================
      - name: Set Image Tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::8}" >> $GITHUB_ENV

      # =========================
      # OIDC AUTH (IMPORTANT)
      # =========================
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      # =========================
      # Setup gcloud
      # =========================
      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      # =========================
      # Docker Authentication (FIXED)
      # =========================
      - name: Configure Docker
        run: |
          gcloud auth configure-docker us-west1-docker.pkg.dev --quiet

      # =========================
      # VERIFY AUTH (DEBUG)
      # =========================
      - name: Verify Authentication
        run: |
          gcloud auth list
          docker info

      # =========================
      # FRONTEND BUILD & PUSH
      # =========================
      - name: Build & Push Frontend
        run: |
          docker build \
            -t us-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${FRONTEND_REPO}/${FRONTEND_IMAGE}:frontend-$IMAGE_TAG \
            -t us-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${FRONTEND_REPO}/${FRONTEND_IMAGE}:frontend-latest \
            ./frontend

          docker push us-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${FRONTEND_REPO}/${FRONTEND_IMAGE}:frontend-$IMAGE_TAG
          docker push us-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${FRONTEND_REPO}/${FRONTEND_IMAGE}:frontend-latest

      # =========================
      # BACKEND BUILD & PUSH
      # =========================
      - name: Build & Push Backend
        run: |
          docker build \
            -t us-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${BACKEND_REPO}/${BACKEND_IMAGE}:backend-$IMAGE_TAG \
            -t us-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${BACKEND_REPO}/${BACKEND_IMAGE}:backend-latest \
            ./backend

          docker push us-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${BACKEND_REPO}/${BACKEND_IMAGE}:backend-$IMAGE_TAG
          docker push us-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${BACKEND_REPO}/${BACKEND_IMAGE}:backend-latest
