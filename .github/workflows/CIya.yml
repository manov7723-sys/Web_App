name: Build and Push to Artifact Registry

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GCP_REGION: us-west1
      FRONTEND_REPO: frontend-repo
      BACKEND_REPO: backend-repo
      FRONTEND_IMAGE: myapp1_frontend
      BACKEND_IMAGE: myapp1_backend

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # -------------------------
      # Set Image Tag
      # -------------------------
      - name: Set Image Tag
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA::8}" >> $GITHUB_ENV

      # -------------------------
      # OIDC Authentication
      # -------------------------
      - name: Authenticate to GCP (OIDC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      # -------------------------
      # 🔥 CRITICAL FIX (force docker auth)
      # -------------------------
      - name: Configure Docker Authentication
        run: |
          gcloud auth configure-docker us-west1-docker.pkg.dev --quiet
          gcloud auth print-access-token | docker login -u oauth2accesstoken --password-stdin https://us-west1-docker.pkg.dev

      # -------------------------
      # VERIFY AUTH (debug step)
      # -------------------------
      - name: Verify Auth
        run: |
          gcloud auth list
          docker info

      # =========================
      # FRONTEND BUILD & PUSH
      # =========================
      - name: Build Frontend Image
        run: |
          docker build -t us-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${FRONTEND_REPO}/${FRONTEND_IMAGE}:frontend-$IMAGE_TAG ./frontend

      - name: Push Frontend Image
        run: |
          docker push us-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${FRONTEND_REPO}/${FRONTEND_IMAGE}:frontend-$IMAGE_TAG

      # =========================
      # BACKEND BUILD & PUSH
      # =========================
      - name: Build Backend Image
        run: |
          docker build -t us-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${BACKEND_REPO}/${BACKEND_IMAGE}:backend-$IMAGE_TAG ./backend

      - name: Push Backend Image
        run: |
          docker push us-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${BACKEND_REPO}/${BACKEND_IMAGE}:backend-$IMAGE_TAG
