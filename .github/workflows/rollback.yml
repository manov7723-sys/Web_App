name: Rollback Deployment (SSM Based)

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  rollback:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: us-east-1
      ECR_REGISTRY: 641628981128.dkr.ecr.us-east-1.amazonaws.com
      ECR_REPOSITORY: myapp1_frontend
      ECR_REPOSITORY1: myapp1_backend

    steps:
      # -------------------------
      # 1. AWS OIDC LOGIN
      # -------------------------
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::641628981128:role/github-action
          aws-region: ${{ env.AWS_REGION }}

      # -------------------------
      # 2. GET LAST GOOD TAGS FROM SSM
      # -------------------------
      - name: Get last good image from SSM
        run: |
          FRONTEND_TAG=$(aws ssm get-parameter \
            --name "/myapp/frontend/last-good" \
            --query "Parameter.Value" \
            --output text)

          BACKEND_TAG=$(aws ssm get-parameter \
            --name "/myapp/backend/last-good" \
            --query "Parameter.Value" \
            --output text)

          echo "FRONTEND_TAG=$FRONTEND_TAG" >> $GITHUB_ENV
          echo "BACKEND_TAG=$BACKEND_TAG" >> $GITHUB_ENV

          echo "Rolling back to:"
          echo "Frontend: $FRONTEND_TAG"
          echo "Backend: $BACKEND_TAG"

      # -------------------------
      # 3. SETUP SSH (BASTION → PRIVATE EC2)
      # -------------------------
      - name: Setup SSH (Bastion → Private EC2)
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.BASTION_KEY }}" > ~/.ssh/key
          chmod 600 ~/.ssh/key

          cat >> ~/.ssh/config <<EOF
          Host bastion
              HostName ${{ secrets.BASTION_HOST }}
              User ${{ secrets.BASTION_USER }}
              IdentityFile ~/.ssh/key
              StrictHostKeyChecking no

          Host private-ec2
              HostName ${{ secrets.PRIVATE_EC2_HOST }}
              User ${{ secrets.PRIVATE_EC2_USER }}
              IdentityFile ~/.ssh/key
              ProxyJump bastion
              StrictHostKeyChecking no
          EOF

      # -------------------------
      # 4. ROLLBACK ON EC2
      # -------------------------
      - name: Execute rollback on EC2
        run: |
          ssh private-ec2 "
            set -e

            export AWS_REGION=us-east-1

            aws ecr get-login-password --region \$AWS_REGION | \
              docker login --username AWS --password-stdin $ECR_REGISTRY

            echo 'Rolling back frontend...'
            docker service update \
              --image $ECR_REGISTRY/$ECR_REPOSITORY:$FRONTEND_TAG \
              myapp_frontend

            echo 'Rolling back backend...'
            docker service update \
              --image $ECR_REGISTRY/$ECR_REPOSITORY1:$BACKEND_TAG \
              myapp_backend

            echo 'Current services:'
            docker service ls
          "
