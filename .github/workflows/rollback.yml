name: Manual Rollback Deployment (SSM Based)

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  rollback:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: us-east-1
      ECR_REGISTRY: 641628981128.dkr.ecr.us-east-1.amazonaws.com
      ECR_REPOSITORY: myapp1_frontend
      ECR_REPOSITORY1: myapp1_backend

    steps:
      # -------------------------
      # AWS OIDC LOGIN
      # -------------------------
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::641628981128:role/github-action
          aws-region: ${{ env.AWS_REGION }}

      # -------------------------
      # GET LAST GOOD TAGS FROM SSM (SAFE VERSION)
      # -------------------------
      - name: Get rollback images from SSM
        run: |
          set -e

          FRONTEND_TAG=$(aws ssm get-parameter \
            --name "/myapp/frontend/last-good" \
            --query "Parameter.Value" \
            --output text 2>/dev/null || true)

          BACKEND_TAG=$(aws ssm get-parameter \
            --name "/myapp/backend/last-good" \
            --query "Parameter.Value" \
            --output text 2>/dev/null || true)

          echo "Frontend rollback -> $FRONTEND_TAG"
          echo "Backend rollback -> $BACKEND_TAG"

          # ---------------- SAFETY CHECK ----------------
          if [ -z "$FRONTEND_TAG" ] || [ -z "$BACKEND_TAG" ]; then
            echo "❌ ERROR: Missing rollback versions in SSM"
            echo "Rollback aborted safely"
            exit 1
          fi

          echo "FRONTEND_TAG=$FRONTEND_TAG" >> $GITHUB_ENV
          echo "BACKEND_TAG=$BACKEND_TAG" >> $GITHUB_ENV

      # -------------------------
      # SSH SETUP (BASTION → EC2)
      # -------------------------
      - name: Setup SSH
        run: |
          set -e
          mkdir -p ~/.ssh

          echo "${{ secrets.BASTION_KEY }}" > ~/.ssh/key
          chmod 600 ~/.ssh/key

          cat >> ~/.ssh/config <<EOF
          Host bastion
              HostName ${{ secrets.BASTION_HOST }}
              User ${{ secrets.BASTION_USER }}
              IdentityFile ~/.ssh/key
              StrictHostKeyChecking no

          Host private-ec2
              HostName ${{ secrets.PRIVATE_EC2_HOST }}
              User ${{ secrets.PRIVATE_EC2_USER }}
              IdentityFile ~/.ssh/key
              ProxyJump bastion
              StrictHostKeyChecking no
          EOF

      # -------------------------
      # EXECUTE ROLLBACK
      # -------------------------
      - name: Execute rollback on EC2
        run: |
          set -e

          ssh private-ec2 "
            set -e

            echo 'Logging into ECR...'
            aws ecr get-login-password --region $AWS_REGION | \
              docker login --username AWS --password-stdin $ECR_REGISTRY

            echo 'Rolling back frontend → $FRONTEND_TAG'
            docker service update \
              --image $ECR_REGISTRY/$ECR_REPOSITORY:$FRONTEND_TAG \
              myapp_frontend

            echo 'Rolling back backend → $BACKEND_TAG'
            docker service update \
              --image $ECR_REGISTRY/$ECR_REPOSITORY1:$BACKEND_TAG \
              myapp_backend

            echo 'Verifying services...'
            docker service ls
            docker service ps myapp_frontend
            docker service ps myapp_backend

            echo 'Rollback completed successfully'
          "
