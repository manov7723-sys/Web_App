name: Deploy to EC2

on:
  workflow_run:
    workflows: ["Build and Push to ECR"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    permissions:
      id-token: write
      contents: read

    env:
      AWS_REGION: us-east-1
      ECR_REGISTRY: 945219712738.dkr.ecr.us-east-1.amazonaws.com
      ECR_REPOSITORY: myapp1_frontend
      ECR_REPOSITORY1: myapp1_backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set IMAGE_TAG
        run: |
          FULL_SHA="${{ github.event.workflow_run.head_sha }}"
          IMAGE_TAG="${FULL_SHA::8}"
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
          echo "Using IMAGE_TAG=$IMAGE_TAG"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::945219712738:role/GithubAction
          aws-region: ${{ env.AWS_REGION }}

      - name: Copy docker-compose to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml"
          target: "/home/ubuntu/app"

      - name: Deploy with Docker Swarm
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE_TAG,ECR_REGISTRY,ECR_REPOSITORY,ECR_REPOSITORY1,AWS_REGION
          script: |
            set -e

            echo "Deploying IMAGE_TAG=$IMAGE_TAG"

            # EC2 IAM role handles ECR auth directly
            aws ecr get-login-password --region $AWS_REGION | docker login \
              --username AWS \
              --password-stdin $ECR_REGISTRY

            # Pull exact images built in CI
            docker pull $ECR_REGISTRY/$ECR_REPOSITORY:frontend-$IMAGE_TAG
            docker pull $ECR_REGISTRY/$ECR_REPOSITORY1:backend-$IMAGE_TAG

            # Init swarm if not already active
            docker swarm init 2>/dev/null || true

            cd /home/ubuntu/app

            # Export so docker-compose variable substitution works
            export IMAGE_TAG=$IMAGE_TAG

            docker stack deploy \
              --compose-file docker-compose.yml \
              --with-registry-auth \
              myapp

            # Verify services are running
            docker stack services myapp
