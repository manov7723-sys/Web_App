name: Deploy to EC2

on:
  workflow_run:
    workflows: ["Build and Push to ECR"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    permissions:
      id-token: write
      contents: read

    env:
      AWS_REGION: us-east-1
      ECR_REGISTRY: 945219712738.dkr.ecr.us-east-1.amazonaws.com
      ECR_REPOSITORY: myapp1_frontend
      ECR_REPOSITORY1: myapp1_backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set IMAGE_TAG
        run: |
          FULL_SHA="${{ github.event.workflow_run.head_sha }}"
          IMAGE_TAG="${FULL_SHA::8}"
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
          echo "Using IMAGE_TAG=$IMAGE_TAG"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::945219712738:role/GithubAction
          aws-region: ${{ env.AWS_REGION }}

      # ✅ Encode compose file so we can pass it via SSH without SCP
      - name: Encode docker-compose as base64
        run: |
          COMPOSE_B64=$(base64 -w 0 docker-compose.yml)
          echo "COMPOSE_B64=$COMPOSE_B64" >> $GITHUB_ENV

      # ✅ Single SSH step — no SCP needed at all
      - name: Deploy with Docker Swarm
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE_TAG,ECR_REGISTRY,ECR_REPOSITORY,ECR_REPOSITORY1,AWS_REGION,COMPOSE_B64
          script: |
            set -e
            echo "Deploying IMAGE_TAG=$IMAGE_TAG"

            # Write compose file directly from base64 — no SCP needed
            mkdir -p /home/ubuntu/app
            echo "$COMPOSE_B64" | base64 -d > /home/ubuntu/app/docker-compose.yml

            # ECR login using EC2 IAM role
            aws ecr get-login-password --region $AWS_REGION | docker login \
              --username AWS \
              --password-stdin $ECR_REGISTRY

            # Pull exact images
            docker pull $ECR_REGISTRY/$ECR_REPOSITORY:frontend-$IMAGE_TAG
            docker pull $ECR_REGISTRY/$ECR_REPOSITORY1:backend-$IMAGE_TAG

            # Init swarm if not already active
            docker swarm init 2>/dev/null || true

            cd /home/ubuntu/app
            export IMAGE_TAG=$IMAGE_TAG

            docker stack deploy \
              --compose-file docker-compose.yml \
              --with-registry-auth \
              myapp

            docker stack services myapp
