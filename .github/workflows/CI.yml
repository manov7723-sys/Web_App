name: Build, Scan, and Push Docker Images

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ECR_REGISTRY: 945219712738.dkr.ecr.us-east-1.amazonaws.com
      ECR_REPOSITORY_FRONTEND: frontend
      ECR_REPOSITORY_BACKEND: backend

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Commit Tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::8}" >> $GITHUB_ENV

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::945219712738:role/GithubAction
          aws-region: us-east-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main | sudo tee -a /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      # -------- FRONTEND --------
      - name: Build Frontend Image
        run: docker build -t frontend ./frontend

      - name: Scan Frontend Image
        run: trivy image --severity HIGH --exit-code 1 frontend:latest

      - name: Tag and Push Frontend Image
        run: |
          docker tag frontend:latest $ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:$IMAGE_TAG
          docker tag frontend:latest $ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:latest

          docker push $ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:latest

      # -------- BACKEND --------
      - name: Build Backend Image
        run: docker build -t backend ./backend

      - name: Scan Backend Image
        run: trivy image --severity HIGH --exit-code 0 backend:latest

      - name: Tag and Push Backend Image
        run: |
          docker tag backend:latest $ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:$IMAGE_TAG
          docker tag backend:latest $ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:latest

          docker push $ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:latest