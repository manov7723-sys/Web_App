name: Build and Push to ECR



jobs:
  build:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      # ✅ FIXED: Match the single ECR repo used in your CD (my-app1)
      ECR_REGISTRY: 641628981128.dkr.ecr.us-east-1.amazonaws.com
      ECR_REPOSITORY: myapp1_frontend
      ECR_REPOSITORY1: myapp1_backend
      

    permissions:
      id-token: write
      contents: read

    outputs:
      # ✅ ADDED: Expose IMAGE_TAG so the CD workflow can consume it
      image_tag: ${{ steps.set_tag.outputs.image_tag }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ✅ FIXED: Save tag both to env AND as a step output for CD to use
      - name: Set image tag (first 8 chars of commit SHA)
        id: set_tag
        run: |
          TAG=${GITHUB_SHA::8}
          echo "IMAGE_TAG=$TAG" >> $GITHUB_ENV
          echo "image_tag=$TAG" >> $GITHUB_OUTPUT

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::641628981128:role/github-action
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # ✅ FIXED: Build directly with ECR tag, push both SHA and latest
      - name: Build & Push Frontend
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:frontend-$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:frontend-latest \
            ./frontend
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:frontend-$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:frontend-latest

      # ✅ FIXED: Same single-repo pattern for backend
      - name: Build & Push Backend
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY1:backend-$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY1:backend-latest \
            ./backend
          docker push $ECR_REGISTRY/$ECR_REPOSITORY1:backend-$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY1:backend-latest
